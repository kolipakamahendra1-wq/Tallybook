services:
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - reports:/data
    ports:
      - "8030:8030"
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports:
      - "8080:80"
volumes:
  reports:
